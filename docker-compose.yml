services:
  bot:
    build: .
    container_name: learnjp_bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./credentials:/app/credentials
      - ./src:/app/src
      - ./tests:/app/tests
      - ./tools:/app/tools
      - ./docs:/app/docs
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app/src:/app
